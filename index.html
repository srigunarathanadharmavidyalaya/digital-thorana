<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ශ්‍රී ගුණරතන ධර්ම විද්‍යාලයීය ඩිජිටල් වෙසක් කලාපය</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Noto+Serif+Sinhala:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <header class="site-header">
    <div class="hline"></div>
    <div class="header-centre">
      <h1 class="header-title">ශ්‍රී ගුණරතන ධර්ම විද්‍යාලයීය ඩිජිටල් වෙසක් කලාපය</h1>
      <p class="header-en">Digital Vesak · Jataka Tales</p>
    </div>
    <div class="hline"></div>
  </header>

  <main class="stage">

    <div class="lotus-container" id="lotusContainer">

      <!-- Petal layers (generated by JS) -->
      <div class="petal-layer bg-layer" id="layerBackground"></div>
      <div class="petal-layer side-layer" id="layerSide"></div>
      <div class="petal-layer main-layer" id="layerMain"></div>

      <!-- Photo nodes with links -->
      <div id="photoLayer">
        <a class="photo-node" href="stories/story-01/index.html" data-story="story-01">
          <span class="photo-inner">
            <img src="./assets/images/wessanthara/s_6.png" alt="වෙස්සන්තර ජාතකය"/>
          </span>
          <span class="photo-label">වෙස්සන්තර</span>
        </a>
        <a class="photo-node" href="stories/story-02/index.html" data-story="story-02">
          <span class="photo-inner">
            <img src="./assets/images/mahosadha/s_6.png" alt="මහෝසධ ජාතකය"/>
          </span>
          <span class="photo-label">මහෝසධ</span>
        </a>
        <a class="photo-node" href="stories/story-03/index.html" data-story="story-03">
          <span class="photo-inner">
            <img src="./assets/images/nimi/s_1.png" alt="නිමි ජාතකය"/>
          </span>
          <span class="photo-label">නිමි</span>
        </a>
        <a class="photo-node" href="stories/story-05/index.html" data-story="story-05">
          <span class="photo-inner">
            <img src="./assets/images/sutasoma/s_1.png" alt="සුතසෝම ජාතකය"/>
          </span>
          <span class="photo-label">සුතසෝම</span>
        </a>
        <a class="photo-node" href="stories/story-06/index.html" data-story="story-06">
          <span class="photo-inner">
            <img id="6-cover"src="./assets/images/bhuridatta/s_1.png" alt="භූරිදත්ත ජාතකය"/>
          </span>
          <span class="photo-label">භූරිදත්ත</span>
        </a>
        <a class="photo-node" href="stories/story-07/index.html" data-story="story-07">
          <span class="photo-inner">
            <img src="./assets/images/themiya/s_1.png" alt="තේමිය ජාතකය"/>
          </span>
          <span class="photo-label">තේමිය</span>
        </a>
      </div>

      <!-- Center core (Sahasrara) -->
      <div class="lotus-core">
        <div class="core-ring c1"></div>
        <div class="core-ring c2"></div>
        <div class="core-ring c3"></div>
        <div class="core-inner">
          <span class="core-symbol">☸</span>
        </div>

    </div>

  </main>

  <footer class="site-footer">
    <p>සදහම් දානය &nbsp;·&nbsp; Dhamma Dana &nbsp;·&nbsp; Vesak <span id="yr"></span></p>
